# METADADOS BÁSICOS
name: JP Logs
tagline: Artigos e anotações sobre tecnologia, infraestrutura e desenvolvimento.
author: Joao Paulo
language: pt-BR
url: 'bluesball.github.io'
#https: true
#theme: basic

# CAMINHOS
content_path: content
site_path: ''
templates_path: templates
static_path: static
media_path: media

# MENU
menu:
  - [Home, index.html]
  - [Sobre, about.html]
  - [Tags, tags.html]
  - [Arquivo, archive.html]
  - [GitHub, https://github.com/bluesball/bluesball.github.io]

# CONFIGURAÇÕES DE CONTEÚDO
pagination: 10
default_date_format: '%d/%m/%Y'
enable_search: true
enable_related_content: true
toc: true
json_feed: true
show_next_prev_links: true
publish_md: false
#gallery_create_thumbnails: false

# TÍTULOS DAS PÁGINAS (estilo shell)
pages_title: $ ls ~/Pages/
tags_title: SELECT * FROM posts GROUP BY tag
tags_content_title: SELECT * FROM posts WHERE tag = '$tag'
archives_title: SELECT * FROM posts GROUP BY year
archives_content_title: SELECT * FROM posts WHERE year = '$year'
search_title: $ grep -rl "$@" ~/

# ELEMENTOS VISUAIS
footer: |
  <div>Powered by <a href="https://github.com/rochacbruno/marmite">Marmite</a> | <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/">CC BY-NC-SA 4.0</a></div>
